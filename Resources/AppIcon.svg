<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source artwork for AppIcon.icns. Follows the macOS icon grid: an
       824-pt rounded square centred on a 1024-pt canvas, with its shadow. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#f1dfbf"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3b8"/>
      <stop offset="1" stop-color="#f08a93"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="2.2" fill="#1c2427" opacity=".06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="16" stdDeviation="0" flood-color="#1c2427" flood-opacity=".16"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
  </g>

  <!-- motion arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M698 392 A250 250 0 0 1 744 660" stroke="#ef5b66" stroke-width="30"/>
    <path d="M780 388 A330 330 0 0 1 834 736" stroke="#1599a5" stroke-width="26" opacity=".9"/>
  </g>

  <!-- Joy-Con (R), tilted as if pointing -->
  <g transform="translate(455 545) rotate(-16) scale(1.02) translate(-160 -330)" filter="url(#lift)"
     stroke="#1c2427" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <rect x="70" y="10" width="160" height="80" rx="34" fill="#2b3034" transform="rotate(-8 150 50)"/>
    <rect x="40" y="70" width="80" height="540" rx="26" fill="#2b3034"/>
    <path d="M82 70H200a96 96 0 0 1 96 96V514a96 96 0 0 1-96 96H82Z" fill="url(#body)"/>
    <circle cx="196" cy="182" r="27" fill="#2b3034"/>
    <circle cx="146" cy="232" r="27" fill="#2b3034"/>
    <circle cx="246" cy="232" r="27" fill="#2b3034"/>
    <circle cx="196" cy="282" r="27" fill="#2b3034"/>
    <circle cx="184" cy="400" r="54" fill="#2b3034"/>
    <circle cx="184" cy="400" r="30" fill="#4a5258" stroke="none"/>
    <circle cx="152" cy="504" r="22" fill="#4a5258" stroke-width="10"/>
  </g>

  <!-- cursor -->
  <g transform="translate(676 168) rotate(-8) scale(7.2)">
    <path d="M4 2v18l5-5 3.4 7 3-1.4-3.4-7H19z" fill="#1c2427" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
