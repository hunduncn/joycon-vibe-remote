<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source artwork for AppIcon.icns, drawn in the same line-art style as the
       in-app controller (JoyConArtwork.swift) on the macOS icon grid: an
       824-pt rounded square centred on a 1024-pt canvas, with its shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f3f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#c2185b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- motion arcs and pointer -->
  <g fill="none" stroke-linecap="round">
    <path d="M712 410 A250 250 0 0 1 756 672" stroke="#e0528f" stroke-width="28"/>
    <path d="M792 400 A330 330 0 0 1 844 740" stroke="#0a84ff" stroke-width="26"/>
  </g>
  <g transform="translate(700 196) rotate(-8) scale(6.2)">
    <path d="M4 2v18l5-5 3.4 7 3-1.4-3.4-7H19z" fill="#1c2427" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- Joy-Con (R), the in-app drawing tilted as if pointing -->
  <g filter="url(#lift)" transform="translate(440 540) rotate(-14) scale(1.34) translate(-120 -266)">
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M116 17 L122 17 A121 121 0 0 1 217.35 63.50 A6.5 6.5 0 0 1 207.11 71.51 A108 108 0 0 0 122 30 L116 30 A6.5 6.5 0 0 1 116 17 Z" fill="#e0528f" stroke="#e0528f" stroke-width="6"/>
    <path d="M98 32 L122 32 A106 106 0 0 1 226.39 119.59 A5.5 5.5 0 0 1 215.56 121.50 A95 95 0 0 0 122 43 L98 43 A5.5 5.5 0 0 1 98 32 Z" fill="#f5b3cc" stroke="#e0528f" stroke-width="6"/>
    <rect x="28" y="58" width="20" height="416" rx="8" fill="#fdedf2" stroke="#e0528f" stroke-width="6"/>
    <rect x="18" y="104" width="16" height="82" rx="7" fill="#fff" stroke="#e0528f" stroke-width="6"/>
    <rect x="18" y="374" width="16" height="82" rx="7" fill="#fff" stroke="#e0528f" stroke-width="6"/>
    <path d="M58 46 H122 A92 92 0 0 1 214 138 V408 A78 78 0 0 1 136 486 H58 A12 12 0 0 1 46 474 V58 A12 12 0 0 1 58 46 Z" fill="#fdedf2" stroke="#e0528f" stroke-width="6"/>
    <path d="M54 62 V470" stroke="#e0528f" stroke-opacity=".6" stroke-width="3.5" fill="none"/>
    <circle cx="84" cy="88" r="12" fill="#fff" stroke="#e0528f" stroke-width="5"/>
    <path d="M78 88 H90 M84 82 V94" stroke="#e0528f" stroke-width="4" fill="none"/>
    <circle cx="152" cy="129" r="15.5" fill="#fff" stroke="#e0528f" stroke-width="6"/><text x="152" y="134.5" text-anchor="middle" font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#e0528f">X</text><circle cx="121" cy="160" r="15.5" fill="#fff" stroke="#e0528f" stroke-width="6"/><text x="121" y="165.5" text-anchor="middle" font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#e0528f">Y</text><circle cx="183" cy="160" r="15.5" fill="#0a84ff" stroke="#0a84ff" stroke-width="6"/><text x="183" y="165.5" text-anchor="middle" font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#fff">A</text><circle cx="152" cy="191" r="15.5" fill="#fff" stroke="#e0528f" stroke-width="6"/><text x="152" y="196.5" text-anchor="middle" font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#e0528f">B</text>
    <circle cx="140" cy="276" r="35" fill="#fff" stroke="#e0528f" stroke-width="6"/>
    <circle cx="140" cy="276" r="23" fill="#fff" stroke="#e0528f" stroke-width="6"/>
    <circle cx="100" cy="360" r="13" fill="#fff" stroke="#e0528f" stroke-width="5"/>
    <path d="M94.5 360.5 L100 355 L105.5 360.5 V365 H94.5 Z" fill="none" stroke="#e0528f" stroke-width="2.5"/>
  </g>
  </g>
</svg>
