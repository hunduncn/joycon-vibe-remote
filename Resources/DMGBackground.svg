<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <!-- Background of the installer window. Finder draws the app and the
       Applications folder on top at (170, 205) and (470, 205); see
       scripts/dmg-settings.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbd3e2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fbd3e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe2ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#cfe2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#1c2427" opacity=".05"/>
    </pattern>
    <marker id="head" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 1.5 L9 6 L2 10.5" fill="none" stroke="#0a84ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0528f"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg)"/>
  <rect width="640" height="420" fill="url(#dots)"/>
  <ellipse cx="170" cy="210" rx="150" ry="120" fill="url(#pink)"/>
  <ellipse cx="470" cy="210" rx="150" ry="120" fill="url(#blue)"/>

  <text x="320" y="58" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#1c2427">Joy-Con Vibe Remote</text>
  <text x="320" y="84" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#6b7177">把 Joy-Con 变成 Mac 的体感遥控器</text>

  <path d="M250 200 C 290 170, 350 170, 392 200" fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#head)"/>
  <text x="320" y="232" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1c2427">拖到「应用程序」即可安装</text>

  <rect x="96" y="322" width="448" height="46" rx="12" fill="#ffffff" stroke="#e5e7ec"/>
  <text x="320" y="341" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#4b5157">首次打开被拦截？打开「系统设置 → 隐私与安全性」，</text>
  <text x="320" y="358" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#4b5157">在下方找到 Joy-Con Vibe Remote，点「仍要打开」。</text>
</svg>
